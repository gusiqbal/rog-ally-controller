name: Tauri UI Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-tauri:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli@^2

      - name: Build Tauri app
        working-directory: tauri-ui/src-tauri
        run: cargo tauri build --bundles nsis

      - name: Rename standalone exe
        shell: pwsh
        run: |
          Copy-Item "tauri-ui/src-tauri/target/release/rog-ally-controller.exe" "tauri-ui/src-tauri/target/release/ROG-Ally-Controller-portable.exe"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tauri-ui/src-tauri/target/release/ROG-Ally-Controller-portable.exe
            tauri-ui/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
